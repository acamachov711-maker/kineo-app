name: Build Kineo Android APK

# Solo se dispara con un tag v* (p. ej. v1.5.1) o manualmente.
# Ya NO se dispara en cada push a main.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión (ej. 1.5.1). Debe coincidir con build.gradle'
        required: true
        default: '1.5.1'

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK firmado (Kineo)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versión: $VERSION"

      - name: Verify build.gradle version matches
        run: |
          GRADLE_VERSION=$(node -p "fs.readFileSync('android/app/build.gradle','utf8').match(/versionName\s+\"([^\"]+)\"/)[1]")
          if [ "$GRADLE_VERSION" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::build.gradle versionName=$GRADLE_VERSION no coincide con ${{ steps.ver.outputs.version }}"
            exit 1
          fi

      - name: Install NPM dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web app & sync Capacitor Android
        run: |
          npm run build
          npx cap sync android

      - name: Grant execute permission for Gradlew
        working-directory: ./android
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build signed release APK
        working-directory: ./android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "Kineo-v${{ steps.ver.outputs.version }}.apk"
          ls -lh "Kineo-v${{ steps.ver.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kineo-v${{ steps.ver.outputs.version }}-APK
          path: Kineo-v${{ steps.ver.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Kineo v${{ steps.ver.outputs.version }}"
          body: |
            Kineo v${{ steps.ver.outputs.version }} (APK Android firmado con kineo-shared.keystore).
            Instalar encima de la versión anterior conserva tu historial y perfiles.
          files: Kineo-v${{ steps.ver.outputs.version }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
