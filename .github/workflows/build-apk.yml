name: Build Kineo Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK Instalable (Kineo v1.5)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install NPM dependencies
        run: npm install --no-audit --no-fund

      - name: Build Kineo v1.5 Web App & Sync Capacitor Android
        run: |
          npm run build
          npx cap sync android

      - name: Grant execute permission & normalize LF for Gradlew
        working-directory: ./android
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build Signed APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK to Kineo-v1.5.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Kineo-v1.5.apk
          ls -lh Kineo-v1.5.apk

      - name: Upload Kineo-v1.5.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kineo-v1.5-APK
          path: Kineo-v1.5.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK to GitHub Releases (Direct Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.0
          name: "Kineo v1.5 — Live Sync-Partner & UI Mejorada (APK)"
          body: |
            ### 📱 Kineo v1.5 — Smart Duo Gym Tracker (APK Android)
            1. **Sesiones Compartidas en Vivo (2 Teléfonos):** Conéctense con el mismo Código de Sala (`KINEO-XXXX`) para que los pesos, repeticiones y series completadas se actualicen en tiempo real en ambos celulares.
            2. **Acordeón Exclusivo de Ejercicios:** Todos los ejercicios inician contraídos y al tocar uno se expande únicamente ese.
            3. **Claridad Total de Peso por Lado / Mancuerna / Barra:** En Hip Thrust, Prensa, Mancuernas, etc. indica exactamente cuánto poner de cada lado o en cada mano.
            4. **Inputs Libres Corregidos:** Permite registrar `21+` repeticiones en la prueba de peso sin bloquearse en `1` y elimina los ceros a la izquierda (`012`).
            5. **Modo Individual (Solo) o En Pareja:** Selector desde el inicio y en Ajustes, y barra superior sin botón colaborativo redundante.
            6. **Firma Criptográfica Fija:** A partir de v1.5, todas las versiones futuras se actualizarán directamente encima sin borrar datos.
          files: Kineo-v1.5.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
